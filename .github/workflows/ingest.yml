name: Refresh templates

on:
  schedule:
    # Mondays at 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Crawl GitHub for templates
        env:
          # The default token is enough — the ingest only reads public data,
          # but being authenticated triples the search rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run ingest -- --min-stars=200 --limit=40

      # New templates arrive with no README summary or stack, which is most of
      # what makes their page worth reading. Fetch it in the same run.
      - name: Fetch template details
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run details

      - name: Check the site still builds with the new data
        run: npm run build

      # Needs "Allow GitHub Actions to create and approve pull requests" under
      # Settings > Actions > General. Without it the branch still gets pushed,
      # so the run should not go red over the PR step alone.
      - name: Open a pull request if anything changed
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-templates
          title: "chore: refresh template index"
          commit-message: "chore: refresh template index"
          body: |
            Automated `npm run ingest` run. Skim the diff before merging — this is
            the one place a low-quality or mislicensed repository could reach the
            gallery.
          add-paths: |
            data/templates.json
            data/details.json

      - name: Say where the work landed
        run: |
          if [ "${{ steps.pr.outcome }}" = "success" ]; then
            echo "Pull request: ${{ steps.pr.outputs.pull-request-url }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "Could not open a pull request, but the branch is pushed." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Open it yourself: ${{ github.server_url }}/${{ github.repository }}/compare/chore/refresh-templates?expand=1" >> $GITHUB_STEP_SUMMARY
          fi
